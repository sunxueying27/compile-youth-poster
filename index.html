<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>编译青春，代码绘山河｜在线生成器</title>
<style>
:root{--bg:#050b0a;--panel:#0b1717;--green:#00ff9e;--dim:#00be76;--white:#e1f6ef;--line:#174853}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#10251f,#030807 62%);color:var(--white);font-family:system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1100px;margin:auto;padding:24px 16px 48px}.top{border:1px solid var(--line);border-radius:18px;padding:24px;background:#07110fee}
h1{font-size:clamp(24px,4vw,38px);margin:0 0 8px;color:var(--green)}p{line-height:1.7;color:#bdd5cc}.sub{margin-top:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
button{border:1px solid var(--green);background:#073324;color:var(--green);padding:11px 16px;border-radius:9px;font-size:15px;cursor:pointer}
button:hover{background:#0b4934}button:disabled{opacity:.5;cursor:wait}
#status{font-size:14px;color:#9bbdb0;margin:10px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,380px);gap:20px;margin-top:20px}
.preview{background:#020706;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
canvas{width:100%;height:auto;display:block;border-radius:8px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;align-self:start}
.side h2{font-size:18px;color:var(--green);margin-top:0}.side li{line-height:1.7;margin:8px 0}
.note{font-size:13px;color:#8ba99e}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{order:-1}}
</style>
</head>
<body>
<main>
<section class="top">
<h1>编译青春，代码绘山河</h1>
<p class="sub">把代码变成一张荧光终端风格的校园主题海报。打开网页后点击“生成海报”，无需安装 Python。</p>
<div class="actions">
<button id="generate">生成海报</button>
<button id="download" disabled>下载 PNG 图片</button>
<button id="retry">重新加载中国地图数据</button>
</div>
<div id="status">准备就绪。首次生成需要联网加载中国地图 GeoJSON 数据。</div>
</section>
<section class="layout">
<div class="preview"><canvas id="poster" width="1520" height="2640" aria-label="海报预览"></canvas></div>
<aside class="side">
<h2>运行说明</h2>
<ol>
<li>点击“生成海报”，网页会尝试加载全国边界 GeoJSON。</li>
<li>地图数据加载成功后，会绘制中国轮廓、山东财经大学示意星标和图书馆线稿。</li>
<li>点击“下载 PNG 图片”，保存生成结果。</li>
</ol>
<p class="note">说明：这是将你上传的 Python/Pillow 绘图逻辑移植到浏览器的网页版本。地图轮廓取决于在线 GeoJSON 数据源；山东财经大学星标为示意位置，并非精确校址定位。网页运行需要联网。</p>
</aside>
</section>
</main>
<script>
const canvas=document.getElementById('poster'), ctx=canvas.getContext('2d');
const W=760,H=1320,S=2;
const C={bg:'#000807',green:'#00ff9e',dim:'#00be76',frame:'#184853',white:'#e1f6ef'};
const status=document.getElementById('status'), gen=document.getElementById('generate'), dl=document.getElementById('download');
function setStatus(s){status.textContent=s}
function line(points,color=C.green,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function text(str,x,y,size=21,color=C.green,font='Microsoft YaHei, sans-serif',align='left'){ctx.fillStyle=color;ctx.font=`${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(str,x,y)}
function center(str,y,size=21,color=C.green,font='Microsoft YaHei, sans-serif'){text(str,W/2,y,size,color,font,'center')}
function star(cx,cy,r=12){let pts=[];for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2===0?r:r*.42;pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)])}ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=C.green;ctx.fill()}
async function fetchGeo(){
 const urls=['https://raw.githubusercontent.com/BarbarossaWang/cn-atlas/main/nation.json','https://geojson.cn/api/china/100000.json'];
 let err;
 for(const url of urls){try{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){err=e}}
 throw err||new Error('地图数据加载失败');
}
function extractRings(obj){let rings=[];function geom(g){if(!g)return;let t=g.type,c=g.coordinates||[];if(t==='Polygon'){if(c.length)rings.push(c[0])}else if(t==='MultiPolygon'){for(const p of c)if(p.length)rings.push(p[0])}else if(t==='GeometryCollection'){(g.geometries||[]).forEach(geom)}}
 if(obj.type==='FeatureCollection')(obj.features||[]).forEach(f=>geom(f.geometry));else if(obj.type==='Feature')geom(obj.geometry);else geom(obj);return rings.map(r=>r.filter(p=>p&&p.length>=2).map(p=>[+p[0],+p[1]])).filter(r=>r.length>=4)}
function drawBase(){
 ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle=C.frame;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(4,4,W-8,H-8,22);ctx.stroke();
 ctx.fillStyle='#0a1f2b';ctx.beginPath();ctx.roundRect(9,9,W-18,36,12);ctx.fill();ctx.fillRect(9,28,W-18,17);
 ctx.fillStyle=C.green;ctx.beginPath();ctx.moveTo(30,17);ctx.lineTo(30,34);ctx.lineTo(44,25);ctx.fill();text('终端输出',58,10,22,C.white);
 text('PS D:\\compile_youth> python compile_youth.py',28,58,19,C.green,'Consolas, monospace');
}
function drawLibrary(){
 const lc=C.dim;
 line([[50,385],[120,363],[175,385],[245,401]],C.green,2);line([[60,391],[130,375],[190,396],[255,408]],C.green,2);
 ctx.strokeStyle=lc;ctx.lineWidth=2;ctx.strokeRect(68,397,380,92);ctx.strokeRect(82,409,352,71);
 line([[68,425],[448,425]],lc,2);line([[68,467],[448,467]],lc,2);
 ctx.beginPath();ctx.moveTo(218,409);ctx.lineTo(252,391);ctx.lineTo(286,409);ctx.stroke();ctx.strokeRect(229,421,47,59);
 for(let x=92;x<424;x+=20){ctx.strokeRect(x,433,10,25);line([[x,445],[x+10,445]],lc,1)}
 line([[54,489],[462,489]],C.green,2);line([[42,498],[474,498]],C.green,2);line([[32,507],[486,507]],C.green,2);
 center('山财图书馆',516,23);
 line([[70,552],[135,552]],C.green,2);line([[625,552],[690,552]],C.green,2);
 center('以代码为笔，绘山河万里',538,22);center('承财大精神，担时代使命',590,21);
 center('共调试1024次bug，',625,21);center('终成理想模样',656,21);
 center("Happy 1024 Programmers' Day!",704,22,C.green,'Consolas, monospace');
 for(let x=30;x<W-24;x+=14)line([[x,764],[x+8,764]],C.dim,2);
 text('[运行结果]',32,785,21);text('母校赋予我知识的力量：',32,821,21);
 text('燕山校区 · 机房的第一行代码',32,850,20);text('圣井校区 · 青春的无限可能',32,878,20);text('舜耕校区 · 文脉的精神传承',32,906,20);
 text('亲友给我不变的支持：',32,963,21);text('是栈底，是归处，永远不会溢出',32,992,20);
 text('陪你调每一个bug，熬每一个深夜',32,1020,20);text('帮你捕获异常，指引正确的分支',32,1048,20);
 text('青春教会我成长的意义：',32,1105,21);text('从懵懂新生到眼里有光的财大程序员',32,1134,19);
 text('每一次调试，都是更好的自己',32,1162,20);text('向着理想，永不停歇',32,1190,20);
 text('而今，我将用代码服务家国，',32,1235,20);text('让技术温暖社会，绘就更大的山河！',32,1263,19);
 text('PS D:\\compile_youth>',32,1294,18,C.green,'Consolas, monospace');
}
async function generate(){
 gen.disabled=true;dl.disabled=true;setStatus('正在加载中国地图数据……');
 try{
  const geo=await fetchGeo(), rings=extractRings(geo);if(!rings.length)throw new Error('数据中没有可绘制的多边形');
  drawBase();
  const pts=rings.flat();let minLon=Math.min(...pts.map(p=>p[0])),maxLon=Math.max(...pts.map(p=>p[0])),minLat=Math.min(...pts.map(p=>p[1])),maxLat=Math.max(...pts.map(p=>p[1]));
  const cos=Math.cos((minLat+maxLat)/2*Math.PI/180), projected=rings.map(r=>r.map(([x,y])=>[x*cos,y]));
  const all=projected.flat(),minX=Math.min(...all.map(p=>p[0])),maxX=Math.max(...all.map(p=>p[0])),minY=Math.min(...all.map(p=>p[1])),maxY=Math.max(...all.map(p=>p[1]));
  const bx0=28,by0=95,bx1=710,by1=525,scale=Math.min((bx1-bx0)/(maxX-minX),(by1-by0)/(maxY-minY)),mapW=(maxX-minX)*scale,mapH=(maxY-minY)*scale,ox=bx0+((bx1-bx0)-mapW)/2,oy=by0+((by1-by0)-mapH)/2;
  const pix=projected.map(r=>r.map(([x,y])=>[ox+(x-minX)*scale,oy+(maxY-y)*scale]));
  // Glow outline
  ctx.save();ctx.shadowColor=C.green;ctx.shadowBlur=8;pix.forEach(r=>line([...r,r[0]],'rgba(0,255,158,.85)',2));ctx.restore();
  pix.forEach(r=>line([...r,r[0]],C.green,1.4));
  const sx=ox+(118.5*cos-minX)*scale,sy=oy+(maxY-36.7)*scale;star(sx,sy,12);star(sx+28,sy+48,10);
  center('山东财经大学',137,24);drawLibrary();
  // Hi-res canvas already 2x; fit preview and download
  dl.disabled=false;setStatus('生成完成！点击“下载 PNG 图片”保存海报。地图数据已从在线 GeoJSON 源加载。');
 }catch(e){drawBase();drawLibrary();setStatus('地图数据加载失败：'+e.message+'。可检查网络或稍后重试；当前已显示海报文字和线稿。');}
 finally{gen.disabled=false}
}
gen.addEventListener('click',generate);document.getElementById('retry').addEventListener('click',generate);
dl.addEventListener('click',()=>{const a=document.createElement('a');a.download='编译青春_代码绘山河.png';a.href=canvas.toDataURL('image/png');a.click()});
drawBase();drawLibrary();
</script>
</body>
</html>
